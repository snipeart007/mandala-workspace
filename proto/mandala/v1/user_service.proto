syntax = "proto3";

option go_package = "./gen";

package v1;

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  bytes metadata = 4;
}

message CreateUserResponse {
  uint64 user_id = 1;
  uint64 created_at = 2;
}

message RegisterDeviceRequest {
  uint64 user_id = 1;
  bytes public_key = 2;
  bytes metadata = 3;
}

message RegisterDeviceResponse {
    uint64 device_id = 1;
    uint64 created_at = 2;
}

// LoginUserRequest initiates the challenge-response authentication flow
message LoginUserRequest {
  uint64 user_id = 1;
  uint64 device_id = 2;
}

// LoginUserChallenge is sent by the server as a challenge to be signed by the client
message LoginUserChallenge {
  uint64 user_id = 1;
  uint64 device_id = 2;
  uint64 timestamp = 3;  // current server time in seconds since epoch
}

// LoginUserSignatureRequest is sent by the client with the signed challenge
message LoginUserSignatureRequest {
  uint64 user_id = 1;
  uint64 device_id = 2;
  uint64 timestamp = 3;  // timestamp from the challenge payload
  bytes signature = 4;  // ed25519 signature of the LoginUserChallenge
}

// LoginUserTokenResponse is sent by the server after signature verification
message LoginUserTokenResponse {
  string token = 1;  // PASETO token for subsequent authenticated requests
}

message RevokeDeviceRequest {
  uint64 user_id = 1;
  uint64 device_id = 2;
}

message RevokeDeviceResponse {
  bool success = 1;
}

// UserService provides authentication and user management operations.
service UserService {
  // CreateUser creates a new user account with the given details.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // RegisterDevice registers a new device for an existing user, associating a public key.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);

  // RevokeDevice revokes a device, preventing it from logging in and invalidating its current session.
  // Only users with PermAdmin permission can perform this action.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);

  // LoginUser initiates the challenge-response authentication flow.
  // It returns a challenge that the client must sign using the device's private key.
  rpc LoginUser(LoginUserRequest) returns (LoginUserChallenge);

  // VerifyLoginSignature verifies the client's signature of the challenge.
  // If valid, it returns an authentication token for subsequent requests.
  rpc VerifyLoginSignature(LoginUserSignatureRequest) returns (LoginUserTokenResponse);
}
